run:
  timeout: 3m
  tests: false

linters:
  disable-all: true
  enable:
    # Safe & non-goanalysis linters
    - govet
    - errcheck
    - ineffassign
    - typecheck
    - revive
    - gofmt
    - goimports

linters-settings:
  revive:
    rules:
      - name: var-naming
      - name: line-length-limit
        arguments: [120]

issues:
  exclude-use-default: false
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
